---
- name: Collect Stats
  hosts: all
  become: yes
  ignore_unreachable: true
  vars:
    remote_server: "{{ lookup('env', 'remote_server') }}"
    remote_user: "{{ lookup('env', 'remote_user') }}"
    remote_path: "{{ lookup('env', 'remote_path') }}"
    remote_password: "{{ lookup('env', 'remote_password') }}"
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_user: "{{ ansible_become_user }}"
    ansible_become_password: "{{ ansible_become_password }}"
    
  tasks:
    # - name: Check if sshpass is installed
    #   command: dpkg -l | grep sshpass
    #   register: sshpass_check
    #   ignore_errors: true

    - name: Install sshpass with apt-get
      apt:
        name: sshpass
        state: present
      when: sshpass_check.rc != 0
  
    - name: Get the primary IP address using hostname and awk
      shell: "hostname -I | awk '{print $1}'"
      register: primary_ip
  
    - name: List files in message_count directory
      ansible.builtin.shell: "ls {{ remote_path }}"
      register: files_list

    - name: Rename files
      ansible.builtin.command:
        cmd: mv "{{ remote_path }}/{{ item }}" "{{ remote_path }}/{{ primary_ip.stdout }}_{{ item }}"
      with_items: "{{ files_list.stdout_lines }}"
      become: true
      become_user: root
    
    # - name: Debug the primary IP address
    #   debug:
    #     msg: "The primary IP address is {{ primary_ip.stdout }}"
    
    # - name: Example task with sudo
    #   command: whoami
    #   become: true
    #   become_user: "{{ ansible_become_user }}"
    #   become_method: sudo
      
    # - name: Append IP address to the start of each file
    #   ansible.builtin.shell: |
    #    for file in message_count/*; do
    #      echo "{{ primary_ip.stdout }}" | cat - "$file" > temp && mv temp "$file"
    #    done
    #   become: true
    #   become_user: root
#      args:
#        chdir: /path/to/your/working/directory

    - name: Copy files from first remote server to second remote server
      ansible.builtin.shell: |
        sshpass -p '{{ remote_password }}' scp -o StrictHostKeyChecking=no -r message_count/* {{ remote_user }}@{{ remote_server }}:{{ remote_path }}

