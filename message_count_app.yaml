---
- name: Collect Stats
  hosts: all
  become: yes
  ignore_unreachable: true
  vars:
    reg: "{{ reg }}"
    user: "{{ user }}"
    pass: "{{ pass }}"
    
  tasks:
    - name: Log in to Docker registry
      docker_login:
        registry: {{ reg }}
        username: {{ user }}
        password: {{ pass }}
        
    - name: Pull Docker Image
      ansible.builtin.shell: |
        docker pull giggly/message_count:latest
        
    - name: Collect Stats for Year 2023
      ansible.builtin.shell: |
        docker run --rm \
          -e INTELLICON_LICENSE_URL="http://127.0.0.1:4000/api/core/license" \
          -e START_DATE="2023-01-01 00:00:00" \
          -e END_DATE="2023-12-31 11:59:59" \
          -e FOR_YEAR=2023 \
          --network host \
          -v $PWD/message_count:/usr/src/app/assets/ \
          giggly/message_count:latest \
          iman_script.js

    - name: Collect Stats for Year 2024
      ansible.builtin.shell: |
        docker run --rm \
          -e INTELLICON_LICENSE_URL="http://127.0.0.1:4000/api/core/license" \
          -e START_DATE="2024-01-01 00:00:00" \
          -e END_DATE="2024-12-31 11:59:59" \
          -e FOR_YEAR=2024 \
          --network host \
          -v $PWD/message_count:/usr/src/app/assets/ \
          giggly/message_count:latest \
          iman_script.js
